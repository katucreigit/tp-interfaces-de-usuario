```yaml
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos
        run: |
          mkdir -p _site/1 _site/2 _site/3

          # ENTREGA 1
          cp "entrega 1/index.html" _site/1/index.html

          # ENTREGA 2
          cp -r "entrega 2/html/." _site/2/

          for carpeta in css js img; do
            if [ -d "entrega 2/$carpeta" ]; then
              cp -r "entrega 2/$carpeta" _site/2/
            fi
          done

          # ENTREGA 3
          cp -r "entrega 3/html/." _site/3/

          for carpeta in css js img; do
            if [ -d "entrega 3/$carpeta" ]; then
              cp -r "entrega 3/$carpeta" _site/3/
            fi
          done

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
```
