name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos
        run: |
          mkdir -p _site/1
          mkdir -p _site/2

          # ENTREGA 1
          cp "entrega 1/index.html" _site/1/index.html

          # ENTREGA 2
          cp -r "entrega 2/html/." _site/2/
          cp -r "entrega 2/css" _site/2/
          cp -r "entrega 2/js" _site/2/
          cp -r "entrega 2/img" _site/2/

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
