name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos
        run: |
          mkdir -p _site/1
          mkdir -p _site/2
          mkdir -p _site/3
          mkdir -p _site/4

          # ENTREGA 1
          cp "entrega 1/index.html" _site/1/index.html

          # ENTREGA 2
          cp -r "entrega 2/html/." _site/2/
          cp -r "entrega 2/css" _site/2/
          cp -r "entrega 2/js" _site/2/
          cp -r "entrega 2/img" _site/2/

          # ENTREGA 3
          if [ ! -d "entrega 3" ]; then
            echo "ERROR: No existe entrega 3"
            exit 1
          fi

          cp -r "entrega 3/." _site/3/

          # ENTREGA 4
          if [ ! -d "entrega 4" ]; then
            echo "ERROR: No existe entrega 4"
            exit 1
          fi

          cp -r "entrega 4/." _site/4/

          # Verificar archivos publicados
          echo "Archivos de la entrega 3:"
          find _site/3 -type f

          echo "Archivos de la entrega 4:"
          find _site/4 -type f

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
